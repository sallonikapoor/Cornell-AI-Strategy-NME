<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg">
<title>A model that learns the trend next to a model that memorizes every point</title>
<desc>Two charts of weekly spin class sign-ups over 12 weeks, rising from about 18 to about 47 with small ups and downs. On the left, a straight line follows the overall upward trend. On the right, a curvy line passes through every single point, swinging up and down with each bump.</desc>
